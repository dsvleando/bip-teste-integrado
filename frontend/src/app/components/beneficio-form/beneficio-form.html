<h2 mat-dialog-title>{{ isEditMode ? 'Editar' : 'Novo' }} Benefício</h2>

<mat-dialog-content>
  <form [formGroup]="beneficioForm" class="beneficio-form">
    <mat-form-field appearance="outline">
      <mat-label>Nome</mat-label>
      <input matInput formControlName="nome" required>
      @if (beneficioForm.get('nome')?.hasError('required') && beneficioForm.get('nome')?.touched) {
        <mat-error>{{ getErrorMessage('nome') }}</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Descrição</mat-label>
      <textarea matInput formControlName="descricao" rows="3"></textarea>
      @if (beneficioForm.get('descricao')?.hasError('maxlength')) {
        <mat-error>{{ getErrorMessage('descricao') }}</mat-error>
      }
    </mat-form-field>

    <app-currency-input formControlName="valor" label="Valor" [required]="true" [min]="0.01"></app-currency-input>

    <mat-checkbox formControlName="ativo">Ativo</mat-checkbox>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancelar()">Cancelar</button>
  <button mat-raised-button color="primary" (click)="salvar()" [disabled]="!beneficioForm.valid">
    Salvar
  </button>
</mat-dialog-actions>
