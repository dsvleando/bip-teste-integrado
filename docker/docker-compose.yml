services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: bip-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:h2:mem:beneficiosdb
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.h2.Driver
      - SPRING_DATASOURCE_USERNAME=sa
      - SPRING_DATASOURCE_PASSWORD=
      - SERVER_PORT=8080
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api-docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - bip-network

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        API_URL: "${FRONTEND_API_URL:-/api/v1}"
    container_name: bip-frontend
    ports:
      - "4200:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - bip-network
    environment:
      FRONTEND_API_URL: "${FRONTEND_API_URL:-/api/v1}"
      BACKEND_API_HOST: "${BACKEND_API_HOST:-backend}"
      BACKEND_API_PORT: "${BACKEND_API_PORT:-8080}"

networks:
  bip-network:
    driver: bridge

